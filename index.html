<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>برنامه کلاسی دبیرستان شهید حسن باقری</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --glass-bg: rgba(255,255,255,0.15);
    --glass-border: rgba(255,255,255,0.25);
    --gold: #d4af37;
    --gold-light: #f5d76e;
    --green: #34d399;
    --text-soft: rgba(255,255,255,0.75);
  }
  body {
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    background: linear-gradient(135deg, #0f0c29 0%, #302b63 45%, #24243e 100%);
    min-height: 100vh; padding: 30px 20px 60px; color: #fff;
    position: relative; overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  body::before, body::after {
    content: ""; position: fixed; border-radius: 50%;
    filter: blur(90px); opacity: 0.55; z-index: 0; pointer-events: none;
  }
  body::before { width: 480px; height: 480px;
    background: radial-gradient(circle, #7c3aed, transparent 70%);
    top: -140px; right: -120px;
    animation: float1 14s ease-in-out infinite; }
  body::after { width: 520px; height: 520px;
    background: radial-gradient(circle, #2563eb, transparent 70%);
    bottom: -180px; left: -140px;
    animation: float2 16s ease-in-out infinite; }
  @keyframes float1 {
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(-40px,50px) scale(1.1);}
  }
  @keyframes float2 {
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(50px,-40px) scale(1.15);}
  }
  .bg-blob {
    position: fixed; width: 400px; height: 400px; border-radius: 50%;
    background: radial-gradient(circle, #db2777, transparent 70%);
    filter: blur(100px); opacity: 0.4; top: 40%; left: 45%;
    z-index: 0; pointer-events: none;
    animation: float3 18s ease-in-out infinite;
  }
  @keyframes float3 {
    0%,100%{transform:translate(-50%,-50%) scale(1);}
    50%{transform:translate(-45%,-55%) scale(1.2);}
  }

  .container { max-width: 900px; margin: 0 auto; position: relative; z-index: 1; }

  /* ==== هدر ==== */
  header { text-align: center; margin-bottom: 26px; padding: 16px; }

  .logo {
    width: 110px;
    height: 110px;
    object-fit: contain;
    display: block;
    margin: 0 auto 14px;
    border-radius: 50%;
    filter: drop-shadow(0 8px 24px rgba(212, 175, 55, 0.5))
            drop-shadow(0 3px 10px rgba(0, 0, 0, 0.3));
    animation: logoFloat 4.5s ease-in-out infinite;
    background: rgba(255, 255, 255, 0.08);
    padding: 6px;
    border: 1.5px solid rgba(212, 175, 55, 0.35);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  @keyframes logoFloat {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-6px) rotate(-1deg); }
  }

  header h1 {
    font-size: 1.9rem; font-weight: 800; margin-bottom: 10px; line-height: 1.5;
    background: linear-gradient(135deg, #fff 0%, #f5d76e 45%, #d4af37 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; letter-spacing: -0.5px;
  }
  header p { color: var(--text-soft); font-size: 0.95rem; }

  .glass {
    background: var(--glass-bg);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.15);
  }

  /* ==== جعبه جستجو ==== */
  .search-box { padding: 22px; margin-bottom: 20px; }
  .search-box label { display: block; margin-bottom: 12px; font-weight: 600; }
  .search-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }
  .search-icon {
    position: absolute;
    right: 18px;
    font-size: 1.1rem;
    opacity: 0.6;
    pointer-events: none;
    z-index: 1;
  }
  input[type="text"] {
    width: 100%;
    padding: 15px 50px 15px 50px;
    font-size: 1rem;
    font-family: inherit;
    color: #fff;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 14px;
    transition: all 0.25s ease;
  }
  input[type="text"]::placeholder { color: rgba(255,255,255,0.5); }
  input[type="text"]:focus {
    outline: none; background: rgba(255,255,255,0.15);
    border-color: rgba(212,175,55,0.7);
    box-shadow: 0 0 0 4px rgba(212,175,55,0.15);
  }

  /* دکمه پاک کردن */
  .clear-btn {
    position: absolute;
    left: 12px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    font-size: 0.9rem;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    padding: 0;
    box-shadow: none;
    font-family: inherit;
  }
  .clear-btn.visible { display: flex; }
  .clear-btn:hover {
    background: rgba(255, 107, 107, 0.3);
    border-color: rgba(255, 107, 107, 0.5);
    transform: scale(1.05);
    box-shadow: none;
  }

  /* ==== کارت کلاس بعدی ==== */
  .next-class-card { padding: 24px; margin-bottom: 20px; display: none; animation: slideDown 0.5s ease; }
  .next-class-card.visible { display: block; }
  @keyframes slideDown {
    from{opacity:0;transform:translateY(-20px);}
    to{opacity:1;transform:translateY(0);}
  }
  .next-class-card.teaching {
    border-color: rgba(52,211,153,0.5);
    box-shadow: 0 8px 32px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.15),
                0 0 40px rgba(52,211,153,0.25);
  }
  .next-class-card.upcoming {
    border-color: rgba(212,175,55,0.5);
    box-shadow: 0 8px 32px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.15),
                0 0 40px rgba(212,175,55,0.25);
  }

  .next-class-header {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 16px; color: var(--text-soft);
    font-size: 0.85rem; font-weight: 600;
  }
  .pulse-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--green); box-shadow: 0 0 0 0 rgba(52,211,153,0.7);
    animation: pulse 2s infinite;
  }
  .pulse-dot.gold { background: var(--gold); box-shadow: 0 0 0 0 rgba(212,175,55,0.7); }
  .pulse-dot.gray { background: #94a3b8; box-shadow: 0 0 0 0 rgba(148,163,184,0.5); }
  @keyframes pulse {
    0%{box-shadow:0 0 0 0 rgba(52,211,153,0.7);}
    70%{box-shadow:0 0 0 12px rgba(52,211,153,0);}
    100%{box-shadow:0 0 0 0 rgba(52,211,153,0);}
  }

  .countdown {
    font-size: 2.4rem; font-weight: 800; line-height: 1.2; margin-bottom: 8px;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(135deg, #fff, #f5d76e);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .next-class-card.teaching .countdown {
    background: linear-gradient(135deg, #fff, #34d399);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .countdown-sub { font-size: 1rem; color: var(--text-soft); margin-bottom: 16px; }
  .next-class-info {
    display: flex; flex-wrap: wrap; gap: 12px;
    padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.12);
  }
  .info-chip {
    display: flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    padding: 8px 14px; border-radius: 10px; font-size: 0.85rem;
  }
  .info-chip strong { color: var(--gold-light); font-weight: 700; }

  /* ==== نوار پیشرفت کلاس ==== */
  .progress-bar {
    width: 100%;
    height: 8px;
    background: rgba(255,255,255,0.08);
    border-radius: 10px;
    overflow: hidden;
    margin: 4px 0 10px;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #34d399, #10b981);
    border-radius: 10px;
    transition: width 1s linear;
    box-shadow: 0 0 12px rgba(52,211,153,0.5);
  }
  .progress-labels {
    display: flex;
    justify-content: space-between;
    font-size: 0.75rem;
    color: var(--text-soft);
    margin-bottom: 16px;
  }

  /* ==== هشدار پایان کلاس ==== */
  .next-class-card.teaching.warning {
    border-color: rgba(251, 191, 36, 0.6);
    box-shadow: 0 8px 32px rgba(0,0,0,0.2),
                0 0 40px rgba(251, 191, 36, 0.35);
    animation: warningPulse 2s ease-in-out infinite;
  }
  .next-class-card.teaching.warning .countdown {
    background: linear-gradient(135deg, #fff, #fbbf24);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .next-class-card.teaching.warning .pulse-dot {
    background: #fbbf24;
    animation: pulseWarning 1s infinite;
  }
  .next-class-card.teaching.warning .progress-fill {
    background: linear-gradient(90deg, #fbbf24, #f59e0b);
    box-shadow: 0 0 12px rgba(251,191,36,0.6);
  }
  @keyframes warningPulse {
    0%, 100% { box-shadow: 0 8px 32px rgba(0,0,0,0.2), 0 0 40px rgba(251,191,36,0.35); }
    50%      { box-shadow: 0 8px 32px rgba(0,0,0,0.2), 0 0 55px rgba(251,191,36,0.6); }
  }
  @keyframes pulseWarning {
    0%   { box-shadow: 0 0 0 0 rgba(251,191,36,0.7); }
    70%  { box-shadow: 0 0 0 12px rgba(251,191,36,0); }
    100% { box-shadow: 0 0 0 0 rgba(251,191,36,0); }
  }

  /* ==== نتیجه جستجو ==== */
  .result { padding: 26px; min-height: 120px; animation: fadeIn 0.4s ease; }
  @keyframes fadeIn {
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
  }

  .teacher-header {
    display: flex; align-items: center; gap: 16px;
    padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.15);
    margin-bottom: 22px;
  }
  .avatar {
    width: 58px; height: 58px; border-radius: 50%;
    background: linear-gradient(135deg, rgba(212,175,55,0.9), rgba(245,215,110,0.9));
    border: 1.5px solid rgba(255,255,255,0.35);
    display: flex; align-items: center; justify-content: center;
    color: #2a1f00; font-weight: 800; font-size: 1.4rem; flex-shrink: 0;
  }
  .teacher-header h2 { font-size: 1.25rem; font-weight: 700; margin-bottom: 5px; }
  .teacher-header small { color: var(--text-soft); font-size: 0.83rem; }

  /* ==== کارت انتخاب دبیر ==== */
  .selection-header {
    text-align: center;
    padding: 10px 0 24px;
    border-bottom: 1px solid rgba(255,255,255,0.12);
    margin-bottom: 22px;
  }
  .selection-icon { font-size: 2.8rem; display: block; margin-bottom: 12px; }
  .selection-header h2 { font-size: 1.15rem; font-weight: 700; margin-bottom: 8px; color: #fff; }
  .selection-header p { color: var(--text-soft); font-size: 0.88rem; }
  .selection-list { display: flex; flex-direction: column; gap: 12px; }
  .selection-card {
    display: flex; align-items: center; gap: 16px;
    padding: 18px 20px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 16px;
    cursor: pointer; transition: all 0.25s ease;
    position: relative; overflow: hidden;
  }
  .selection-card::before {
    content: ""; position: absolute;
    right: 0; top: 0; bottom: 0; width: 4px;
    background: linear-gradient(180deg, #d4af37, #f5d76e);
    border-radius: 4px; transition: width 0.25s ease;
  }
  .selection-card:hover {
    background: rgba(212,175,55,0.15);
    border-color: rgba(212,175,55,0.5);
    transform: translateX(-6px);
    box-shadow: 0 8px 24px rgba(212,175,55,0.2);
  }
  .selection-card:hover::before { width: 6px; }
  .selection-avatar {
    width: 54px; height: 54px; border-radius: 50%;
    background: linear-gradient(135deg, rgba(212,175,55,0.9), rgba(245,215,110,0.9));
    border: 1.5px solid rgba(255,255,255,0.35);
    display: flex; align-items: center; justify-content: center;
    color: #2a1f00; font-weight: 800; font-size: 1.3rem; flex-shrink: 0;
  }
  .selection-info { flex: 1; }
  .selection-name { font-weight: 700; font-size: 1.05rem; color: #fff; margin-bottom: 6px; }
  .selection-subject { font-size: 0.88rem; color: var(--gold-light); margin-bottom: 4px; font-weight: 600; }
  .selection-count { font-size: 0.78rem; color: var(--text-soft); }
  .selection-arrow { font-size: 1.5rem; color: var(--gold-light); opacity: 0.5; transition: all 0.25s ease; }
  .selection-card:hover .selection-arrow { opacity: 1; transform: translateX(-6px); }

  /* ==== لیست کلاس‌ها ==== */
  .class-list { display: flex; flex-direction: column; gap: 10px; }
  .class-item {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px; background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 14px; transition: all 0.25s ease;
    position: relative; overflow: hidden;
  }
  .class-item::before {
    content: ""; position: absolute; right: 0; top: 0; bottom: 0;
    width: 4px; background: linear-gradient(180deg, #d4af37, #f5d76e);
    border-radius: 4px;
  }
  .class-item.current {
    background: rgba(52,211,153,0.12);
    border-color: rgba(52,211,153,0.4);
  }
  .class-item.current::before { background: linear-gradient(180deg, #34d399, #10b981); }
  .class-item:hover { background: rgba(255,255,255,0.13); transform: translateX(-5px); }

  .period-badge {
    background: linear-gradient(135deg, rgba(212,175,55,0.95), rgba(245,215,110,0.95));
    color: #2a1f00; padding: 9px 14px; border-radius: 10px;
    font-weight: 700; font-size: 0.85rem; white-space: nowrap;
    min-width: 80px; text-align: center; flex-shrink: 0;
  }
  .class-item.current .period-badge {
    background: linear-gradient(135deg, #34d399, #10b981); color: #042f2e;
  }

  .class-info { flex: 1; }
  .class-info .name { font-weight: 600; margin-bottom: 5px; font-size: 0.95rem; }
  .class-info .details { color: var(--text-soft); font-size: 0.8rem; }

  /* ==== شماره کلاس ==== */
  .class-number {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    padding: 10px 14px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 0.88rem;
    white-space: nowrap;
    flex-shrink: 0;
    transition: all 0.25s ease;
  }
  .class-item.current .class-number {
    background: rgba(52,211,153,0.25);
    border-color: rgba(52,211,153,0.5);
    color: #6ee7b7;
  }
  .class-item:hover .class-number {
    background: rgba(212,175,55,0.2);
    border-color: rgba(212,175,55,0.5);
    color: var(--gold-light);
  }

  /* ==== بخش امروز ==== */
  .today-section { margin-bottom: 8px; }

  .today-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    background: linear-gradient(135deg, rgba(212,175,55,0.22), rgba(245,215,110,0.12));
    border: 1px solid rgba(212,175,55,0.4);
    border-radius: 12px;
    margin-bottom: 14px;
  }
  .today-icon { font-size: 1.3rem; }
  .today-title {
    flex: 1;
    font-weight: 700;
    color: var(--gold-light);
    font-size: 1rem;
  }
  .today-count {
    background: rgba(212,175,55,0.3);
    color: #fff;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.78rem;
    font-weight: 700;
    border: 1px solid rgba(212,175,55,0.5);
  }

  /* ==== حالت گذشته ==== */
  .class-item.past { opacity: 0.55; }
  .class-item.past::before {
    background: linear-gradient(180deg, #64748b, #94a3b8);
  }
  .class-item.past .period-badge {
    background: linear-gradient(135deg, #475569, #64748b);
    color: #cbd5e1;
  }
  .class-item.past .class-number {
    background: rgba(148,163,184,0.15);
    border-color: rgba(148,163,184,0.3);
    color: #cbd5e1;
  }

  /* ==== جداکننده هفته ==== */
  .week-divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 26px 0 20px;
  }
  .divider-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(212,175,55,0.4), transparent);
  }
  .divider-text {
    color: var(--gold-light);
    font-weight: 700;
    font-size: 0.9rem;
    padding: 6px 16px;
    background: rgba(212,175,55,0.1);
    border: 1px solid rgba(212,175,55,0.3);
    border-radius: 20px;
    white-space: nowrap;
  }

  /* ==== عنوان روز در بقیه هفته ==== */
  .day-group-title {
    font-size: 0.88rem;
    font-weight: 700;
    color: var(--gold-light);
    margin: 18px 0 10px;
    padding-right: 10px;
    border-right: 3px solid var(--gold);
  }

  /* ==== حالت بدون کلاس ==== */
  .no-class-today {
    text-align: center;
    padding: 28px 20px;
    background: rgba(52,211,153,0.06);
    border: 1px dashed rgba(52,211,153,0.3);
    border-radius: 14px;
    margin-bottom: 8px;
  }
  .no-class-icon {
    font-size: 2.4rem;
    display: block;
    margin-bottom: 10px;
  }
  .no-class-text {
    font-size: 1rem;
    font-weight: 700;
    color: #6ee7b7;
    margin-bottom: 6px;
  }
  .no-class-sub {
    font-size: 0.83rem;
    color: var(--text-soft);
  }

  /* ==== حالت‌های خالی / خطا ==== */
  .empty-state, .error-state {
    text-align: center; padding: 45px 20px; color: var(--text-soft);
  }
  .empty-state .icon, .error-state .icon {
    font-size: 3rem; margin-bottom: 14px; display: block;
  }
  .error-state { color: #fca5a5; }

  .suggestions {
    margin-top: 16px; display: flex; flex-wrap: wrap;
    gap: 8px; justify-content: center;
  }
  .suggestion-chip {
    padding: 7px 14px; background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 20px; font-size: 0.82rem;
    color: #fff; cursor: pointer; transition: all 0.2s;
  }
  .suggestion-chip:hover {
    background: rgba(212,175,55,0.2);
    border-color: rgba(212,175,55,0.5);
  }

  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
  ::-webkit-scrollbar-thumb { background: rgba(212,175,55,0.5); border-radius: 10px; }

  @media (max-width: 600px) {
    body { padding: 20px 14px 40px; }
    header h1 { font-size: 1.25rem; }
    .logo { width: 85px; height: 85px; }
    .search-box, .result, .next-class-card { padding: 18px; }
    .class-item { flex-wrap: wrap; }
    .period-badge { min-width: 70px; }
    .class-number { width: 100%; text-align: center; }
    .countdown { font-size: 1.8rem; }
    .avatar { width: 50px; height: 50px; font-size: 1.2rem; }
    .selection-card { padding: 14px 16px; }
    .selection-avatar { width: 46px; height: 46px; font-size: 1.1rem; }
    .selection-name { font-size: 0.95rem; }
    .today-header { flex-wrap: wrap; }
  }
</style>
</head>
<body>

<div class="bg-blob"></div>

<div class="container">
  <header>
    <img src="assets/logo.jpg" alt="لوگوی دبیرستان شهید حسن باقری" class="logo">
    <h1>برنامه کلاسی دبیرستان شهید حسن باقری</h1>
    <p>نام دبیر را جستجو کنید تا برنامه هفتگی و کلاس بعدی او را ببینید</p>
  </header>

  <div class="search-box glass">
    <label for="si">جستجوی نام دبیر:</label>
    <div class="search-wrapper">
      <span class="search-icon">🔍</span>
      <input type="text" id="si" placeholder="مثلاً: کریمی، قریب، صالحی..." autocomplete="off">
      <button class="clear-btn" id="clearBtn" onclick="clearSearch()" title="پاک کردن">✕</button>
    </div>
  </div>

  <div class="next-class-card glass" id="ncc"></div>

  <div class="result glass" id="res">
    <div class="empty-state">
      <span class="icon">👨‍🏫</span>

/* ==========================================================
   تفکیک دبیران هم‌نام
   ========================================================== */
var HOMONYM_MAP = {
  "کریمی|زبان": "علی کریمی",
  "کریمی|انگلیسی": "علی کریمی",
  "کریمی|شیمی": "علیرضا کریمی",
  "کریمی|آزمایشگاه": "علیرضا کریمی"
};

function buildDB(){
  var db = {};
  rawData.forEach(function(item){
    var cn = item[0], sch = item[1];
    sch.forEach(function(dr){
      var day = dr[0], lessons = dr[1];
      lessons.forEach(function(lt, idx){
        if(!lt || !lt.trim() || lt === "زنگ آزمون" || lt === "مهارت") return;
        var parts = lt.split(" - ");
        if(parts.length < 2) return;
        var subj = parts[0].trim();
        var trRaw = parts[1].replace("استاد ", "").trim();
        if(!trRaw || trRaw.indexOf("معاون") === 0) return;

        var key = trRaw + "|" + subj;
        var displayName = HOMONYM_MAP[key] || trRaw;

        if(!db[displayName]) db[displayName] = { name: displayName, classes: [] };
        var p = idx + 1;
        db[displayName].classes.push({
          className: cn, day: day, period: p,
          subject: subj,
          start: PERIODS[p].start, end: PERIODS[p].end
        });
      });
    });
  });
  return db;
}

var teacherDB = buildDB();
var teacherNames = Object.keys(teacherDB).sort();

Object.keys(teacherDB).forEach(function(name){
  var counts = {};
  teacherDB[name].classes.forEach(function(c){
    counts[c.subject] = (counts[c.subject] || 0) + 1;
  });
  var topSubject = "", topCount = 0;
  Object.keys(counts).forEach(function(s){
    if(counts[s] > topCount){ topCount = counts[s]; topSubject = s; }
  });
  teacherDB[name].mainSubject = topSubject;
});

/* ==========================================================

   ========================================================== */
function toFa(n){
  var d = ["۰","۱","۲","۳","۴","۵","۶","۷","۸","۹"];
  return String(n).replace(/\d/g, function(x){ return d[x]; });
}
function esc(s){
  var d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}
function t2m(s){
  var p = s.split(":");
  return parseInt(p[0]) * 60 + parseInt(p[1]);
}

/* ==========================================================
   جستجو (زنده)
   ========================================================== */
var currentTeacher = null;
var timer = null;

function doSearch(){
  var input = document.getElementById("si");
  var q = input.value.trim();
  var res = document.getElementById("res");
  var ncc = document.getElementById("ncc");
  var clearBtn = document.getElementById("clearBtn");

  /* نمایش/مخفی کردن دکمه پاک کردن */
  if(q.length > 0){
    clearBtn.classList.add("visible");
  } else {
    clearBtn.classList.remove("visible");
  }

  if(timer){ clearInterval(timer); timer = null; }

  if(!q){
    res.innerHTML = '<div class="empty-state"><span class="icon">👨‍🏫</span><p>برای مشاهده برنامه، نام دبیر را وارد کنید</p><div class="suggestions" id="sug"></div></div>';
    ncc.classList.remove("visible");
    currentTeacher = null;
    buildSuggestions();
    return;
  }

  var matches = teacherNames.filter(function(n){ return n.indexOf(q) > -1; });

  if(matches.length === 0){
    res.innerHTML = '<div class="error-state"><span class="icon">❌</span><p>دبیری با نام «' + esc(q) + '» پیدا نشد</p></div>';
    ncc.classList.remove("visible");
    currentTeacher = null;
    return;
  }

  /* فقط یک دبیر پیدا شد */
  if(matches.length === 1){
    currentTeacher = matches[0];
    res.innerHTML = renderTeacher(teacherDB[matches[0]], true);
    ncc.classList.add("visible");
    updateNCC();
    timer = setInterval(updateNCC, 1000);
    return;
  }

  /* چند دبیر پیدا شد */
  currentTeacher = null;
  ncc.classList.remove("visible");

  var selectionHtml = '<div class="selection-header">' +
    '<span class="selection-icon">👥</span>' +
    '<h2>چند دبیر با این نام پیدا شد</h2>' +
    '<p>لطفاً دبیر مورد نظر خود را انتخاب کنید</p>' +
    '</div>' +
    '<div class="selection-list">';

  matches.forEach(function(name){
    var t = teacherDB[name];
    var initial = name.charAt(0);
    selectionHtml += '<div class="selection-card" onclick="selectTeacher(\'' + name.replace(/'/g, "\\'") + '\')">' +
      '<div class="selection-avatar">' + initial + '</div>' +
      '<div class="selection-info">' +
        '<div class="selection-name">استاد ' + esc(name) + '</div>' +
        '<div class="selection-subject">📚 ' + esc(t.mainSubject) + '</div>' +
        '<div class="selection-count">' + toFa(t.classes.length) + ' کلاس در هفته</div>' +
      '</div>' +
      '<div class="selection-arrow">←</div>' +
    '</div>';
  });

  selectionHtml += '</div>';
  res.innerHTML = selectionHtml;
}

function clearSearch(){
  document.getElementById("si").value = "";
  document.getElementById("si").focus();
  doSearch();
}

function selectTeacher(name){
  var res = document.getElementById("res");
  var ncc = document.getElementById("ncc");

  currentTeacher = name;
  res.innerHTML = renderTeacher(teacherDB[name], true);
  ncc.classList.add("visible");
  updateNCC();
  if(timer) clearInterval(timer);
  timer = setInterval(updateNCC, 1000);

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

   ========================================================== */
function renderTeacher(t, active){
  var sorted = t.classes.slice().sort(function(a, b){
    var dd = dayOrder.indexOf(a.day) - dayOrder.indexOf(b.day);
    if(dd !== 0) return dd;
    return a.period - b.period;
  });

  var now = new Date();
  var cDay = now.getDay();
  var cMin = now.getHours() * 60 + now.getMinutes();

  var todayClasses = [];
  var otherClasses = [];
  sorted.forEach(function(c){
    if(dayMap[c.day] === cDay){
      todayClasses.push(c);
    } else {
      otherClasses.push(c);
    }
  });

  var persianTodayName = "";
  Object.keys(dayMap).forEach(function(k){
    if(dayMap[k] === cDay) persianTodayName = k;
  });

  var initial = t.name.charAt(0);
  var html = '<div class="teacher-header"><div class="avatar">' + initial + '</div><div>' +
    '<h2>استاد ' + esc(t.name) + '</h2>' +
    '<small>📚 ' + esc(t.mainSubject) + ' | مجموع ' + toFa(t.classes.length) + ' کلاس در هفته</small>' +
    '</div></div>';

  if(todayClasses.length > 0){
    html += '<div class="today-section">';
    html += '<div class="today-header">';
    html += '<span class="today-icon">📅</span>';
    html += '<span class="today-title">کلاس‌های امروز (' + esc(persianTodayName) + ')</span>';
    html += '<span class="today-count">' + toFa(todayClasses.length) + ' کلاس</span>';
    html += '</div>';
    html += '<div class="class-list">';

    todayClasses.forEach(function(c){
      var isCur = active && cMin >= t2m(c.start) && cMin < t2m(c.end);
      var isPast = cMin >= t2m(c.end);
      var itemClass = 'class-item' + (isCur ? ' current' : '') + (isPast ? ' past' : '');

      html += '<div class="' + itemClass + '">';
      html += '<div class="period-badge">زنگ ' + toFa(c.period) + '</div>';
      html += '<div class="class-info">';
      html += '<div class="name">' + esc(c.subject) +
              (isCur ? ' <span style="color:#6ee7b7">● در حال تدریس</span>' : '') +
              (isPast ? ' <span style="color:#94a3b8">✓ گذشت</span>' : '') + '</div>';
      html += '<div class="details">🕐 ' + esc(c.start) + ' تا ' + esc(c.end) + '</div>';
      html += '</div>';
      html += '<div class="class-number">🏫 ' + esc(c.className) + '</div>';
      html += '</div>';
    });

    html += '</div></div>';
  } else {
    html += '<div class="no-class-today">';
    html += '<span class="no-class-icon">🎉</span>';
    html += '<div class="no-class-text">امروز (' + esc(persianTodayName) + ') کلاسی نداری</div>';
    html += '<div class="no-class-sub">روز استراحتت مبارک!</div>';
    html += '</div>';
  }

  if(otherClasses.length > 0){
    html += '<div class="week-divider">';
    html += '<span class="divider-line"></span>';
    html += '<span class="divider-text">📋 بقیه هفته</span>';
    html += '<span class="divider-line"></span>';
    html += '</div>';

    var grouped = {};
    otherClasses.forEach(function(c){
      if(!grouped[c.day]) grouped[c.day] = [];
      grouped[c.day].push(c);
    });

    html += '<div class="class-list">';

    Object.keys(grouped).sort(function(a, b){
      return dayOrder.indexOf(a) - dayOrder.indexOf(b);
    }).forEach(function(day){
      html += '<div class="day-group-title">' + esc(day) + '</div>';
      grouped[day].forEach(function(c){
        html += '<div class="class-item">';
        html += '<div class="period-badge">زنگ ' + toFa(c.period) + '</div>';
        html += '<div class="class-info">';
        html += '<div class="name">' + esc(c.subject) + '</div>';
        html += '<div class="details">🕐 ' + esc(c.start) + ' تا ' + esc(c.end) + '</div>';
        html += '</div>';
        html += '<div class="class-number">🏫 ' + esc(c.className) + '</div>';
        html += '</div>';
      });
    });

    html += '</div>';
  }

  return html;
}

/* ==========================================================
   پیدا کردن کلاس فعلی و بعدی
   ========================================================== */
function findCurNext(t, now){
  var cDay = now.getDay(), cMin = now.getHours() * 60 + now.getMinutes();
  var cur = null;
  for(var i = 0; i < t.classes.length; i++){
    var c = t.classes[i];
    if(dayMap[c.day] === cDay && cMin >= t2m(c.start) && cMin < t2m(c.end)){
      cur = c;
      break;
    }
  }
  var next = null, minDiff = Infinity;
  for(var j = 0; j < t.classes.length; j++){
    var c2 = t.classes[j];
    var cd = dayMap[c2.day];
    var cs = t2m(c2.start);
    var dd = (cd - cDay + 7) % 7;
    var dm = dd * 24 * 60 + (cs - cMin);
    if(dd === 0 && cs <= cMin) dm += 7 * 24 * 60;
    if(dm > 0 && dm < minDiff){ minDiff = dm; next = c2; }
  }
  return { cur: cur, next: next };
}

/* ==========================================================
   به‌روزرسانی کارت بالای صفحه
   ========================================================== */
function updateNCC(){
  if(!currentTeacher) return;
  var card = document.getElementById("ncc");
  var t = teacherDB[currentTeacher];
  var now = new Date();
  var fn = findCurNext(t, now);

  /* === حالت ۱: الان در حال تدریس === */
  if(fn.cur){
    var cMin = now.getHours() * 60 + now.getMinutes();
    var cSec = now.getSeconds();
    var endMin = t2m(fn.cur.end);
    var startMin = t2m(fn.cur.start);

    var remainMin = endMin - cMin - 1;
    var remainSec = 60 - cSec;
    if(remainSec === 60){ remainSec = 0; remainMin++; }

    var passedMin = cMin - startMin;

    var hh = Math.floor(remainMin / 60);
    var mm = remainMin % 60;

    var timeText;
    if(hh > 0){
      timeText = toFa(hh) + ' ساعت و ' + toFa(mm) + ' دقیقه';
    } else if(mm > 0){
      timeText = toFa(mm) + ' دقیقه و ' + toFa(remainSec) + ' ثانیه';
    } else {
      timeText = toFa(remainSec) + ' ثانیه';
    }

    var totalMin = endMin - startMin;
    var progress = Math.min(100, Math.max(0, (passedMin / totalMin) * 100));

    var almostDone = remainMin < 5 && hh === 0;
    var cardClass = almostDone ? 'teaching warning' : 'teaching';

    card.className = "next-class-card glass visible " + cardClass;
    card.innerHTML =
      '<div class="next-class-header">' +
        '<span class="pulse-dot"></span>' +
        (almostDone ? 'کلاس شما تقریباً تمام شده ⏰' : 'در حال تدریس 🟢') +
      '</div>' +
      '<div class="countdown">' + timeText + '</div>' +
      '<div class="countdown-sub">' +
        (almostDone ? 'زودتر آماده پایان کلاس باش' : 'تا پایان این کلاس') +
      '</div>' +
      '<div class="progress-bar">' +
        '<div class="progress-fill" style="width:' + progress + '%"></div>' +
      '</div>' +
      '<div class="progress-labels">' +
        '<span>شروع: ' + esc(fn.cur.start) + '</span>' +
        '<span>' + toFa(Math.round(progress)) + '٪ گذشت</span>' +
        '<span>پایان: ' + esc(fn.cur.end) + '</span>' +
      '</div>' +
      '<div class="next-class-info">' +
        '<div class="info-chip">📚 <strong>' + esc(fn.cur.subject) + '</strong></div>' +
        '<div class="info-chip">🏫 ' + esc(fn.cur.className) + '</div>' +
        '<div class="info-chip">🕐 ' + esc(fn.cur.start) + ' تا ' + esc(fn.cur.end) + '</div>' +
        '<div class="info-chip">🔔 زنگ ' + toFa(fn.cur.period) + '</div>' +
      '</div>';
    return;
  }

  /* === حالت ۲: کلاس بعدی === */
  if(fn.next){
    var cDay = now.getDay(), cMin = now.getHours() * 60 + now.getMinutes(), cSec = now.getSeconds();
    var nd = dayMap[fn.next.day];
    var ns = t2m(fn.next.start);
    var dd = (nd - cDay + 7) % 7;
    var tm = dd * 24 * 60 + (ns - cMin);
    if(dd === 0 && ns <= cMin) tm += 7 * 24 * 60;

    var THREE_HOURS = 3 * 60;

    if(tm <= THREE_HOURS){
      var d = Math.floor(tm / (24 * 60));
      var h = Math.floor((tm % (24 * 60)) / 60);
      var m = tm % 60;
      var s = 60 - cSec;
      if(s === 60) s = 0;
      var txt = "";
      if(d > 0) txt = toFa(d) + " روز و " + toFa(h) + " ساعت";
      else if(h > 0) txt = toFa(h) + " ساعت و " + toFa(m) + " دقیقه";
      else if(m > 0) txt = toFa(m) + " دقیقه و " + toFa(s) + " ثانیه";
      else txt = toFa(s) + " ثانیه";

      var close = tm <= 10;
      card.className = "next-class-card glass visible " + (close ? "upcoming" : "");
      card.innerHTML = '<div class="next-class-header"><span class="pulse-dot ' + (close ? "gold" : "gray") + '"></span>' +
        (close ? "کلاس بعدی نزدیک است ⏰" : "کلاس بعدی شما") + '</div>' +
        '<div class="countdown">' + txt + '</div>' +
        '<div class="countdown-sub">تا شروع کلاس بعدی</div>' +
        '<div class="next-class-info"><div class="info-chip">📚 <strong>' + esc(fn.next.subject) + '</strong></div>' +
        '<div class="info-chip">🏫 ' + esc(fn.next.className) + '</div>' +
        '<div class="info-chip">📅 ' + esc(fn.next.day) + '</div>' +
        '<div class="info-chip">🕐 ' + esc(fn.next.start) + ' تا ' + esc(fn.next.end) + '</div>' +
        '<div class="info-chip">🔔 زنگ ' + toFa(fn.next.period) + '</div></div>';
      return;
    }

    var dayText;
    if(dd === 0){ dayText = "امروز"; }
    else if(dd === 1){ dayText = "فردا"; }
    else { dayText = fn.next.day; }

    card.className = "next-class-card glass visible";
    card.innerHTML = '<div class="next-class-header"><span class="pulse-dot gray"></span>کلاس بعدی شما</div>' +
      '<div class="countdown" style="font-size:1.9rem">' + esc(dayText) + ' کلاس داری 📅</div>' +
      '<div class="countdown-sub">ساعت ' + esc(fn.next.start) + ' - ' + esc(fn.next.day) + '</div>' +
      '<div class="next-class-info"><div class="info-chip">📚 <strong>' + esc(fn.next.subject) + '</strong></div>' +
      '<div class="info-chip">🏫 ' + esc(fn.next.className) + '</div>' +
      '<div class="info-chip">🕐 ' + esc(fn.next.start) + ' تا ' + esc(fn.next.end) + '</div>' +
      '<div class="info-chip">🔔 زنگ ' + toFa(fn.next.period) + '</div></div>';
    return;
  }

  card.className = "next-class-card glass visible";
  card.innerHTML = '<div class="next-class-header"><span class="pulse-dot gray"></span>کلاس بعدی</div>' +
    '<div class="countdown">کلاسی یافت نشد</div>';
}

/* ==========================================================
   پیشنهادها
   ========================================================== */
function buildSuggestions(){
  var sug = document.getElementById("sug");
  if(!sug) return;
  sug.innerHTML = "";
  var pops = ["کریمی", "قریب", "صالحی", "روشنگر", "جعفری", "درخشانی"];
  pops.forEach(function(n){
    if(teacherNames.indexOf(n) > -1){
      var c = document.createElement("div");
      c.className = "suggestion-chip";
      c.textContent = n;
      c.onclick = function(){
        document.getElementById("si").value = n;
        doSearch();
        document.getElementById("si").focus();
      };
      sug.appendChild(c);
    }
  });
}

/* ==========================================================
   رویدادها - جستجوی زنده با debounce
   ========================================================== */
var liveSearchTimer = null;
document.getElementById("si").addEventListener("input", function(){
  if(liveSearchTimer) clearTimeout(liveSearchTimer);
  liveSearchTimer = setTimeout(doSearch, 150);
});

/* همچنان با Enter هم کار کنه */
document.getElementById("si").addEventListener("keypress", function(e){
  if(e.key === "Enter"){
    if(liveSearchTimer) clearTimeout(liveSearchTimer);
    doSearch();
  }
});

/* ساخت پیشنهادهای اولیه */
buildSuggestions();
</script>
