<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دبیرستان شهید حسن باقری — سامانه استعلام کلاس‌های اساتید</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root, body.dark {
    --bg-1: #0a0a0a;
    --bg-2: #1a1a1a;
    --bg-3: #0d0d0d;
    --text-light: #ffffff;
    --text-soft: rgba(245,215,110,0.7);
    --text-dim: rgba(245,215,110,0.45);
    --glass-bg: rgba(20,20,20,0.55);
    --glass-border: rgba(212,175,55,0.35);
    --glass-hover: rgba(30,30,30,0.65);
    --gold: #d4af37;
    --gold-light: #f5d76e;
    --green: #34d399;
    --input-bg: rgba(15,15,15,0.6);
    --input-border: rgba(212,175,55,0.3);
    --card-bg: rgba(20,20,20,0.5);
    --card-border: rgba(212,175,55,0.25);
    --shadow: rgba(0,0,0,0.6);
    --modal-bg: linear-gradient(135deg, rgba(15,15,15,0.98), rgba(5,5,5,0.98));
  }

  body.light {
    --bg-1: #f8f4e9;
    --bg-2: #fff8e7;
    --bg-3: #fef5e7;
    --text-light: #1a1a2e;
    --text-soft: rgba(26,26,46,0.7);
    --text-dim: rgba(26,26,46,0.45);
    --glass-bg: rgba(255,255,255,0.7);
    --glass-border: rgba(212,175,55,0.35);
    --glass-hover: rgba(212,175,55,0.1);
    --gold: #b8941f;
    --gold-light: #9a7814;
    --green: #059669;
    --input-bg: rgba(255,255,255,0.85);
    --input-border: rgba(212,175,55,0.35);
    --card-bg: rgba(255,255,255,0.75);
    --card-border: rgba(212,175,55,0.25);
    --shadow: rgba(212,175,55,0.15);
    --modal-bg: linear-gradient(135deg, #fff, #f8f4e9);
  }

  body {
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    background:
      radial-gradient(ellipse at top, var(--bg-2) 0%, transparent 50%),
      radial-gradient(ellipse at bottom, var(--bg-3) 0%, transparent 50%),
      var(--bg-1);
    min-height: 100vh; padding: 30px 20px 40px;
    color: var(--text-light);
    position: relative; overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    transition: background 0.4s ease, color 0.3s ease;
  }

  body::before, body::after {
    content: ""; position: fixed; border-radius: 50%;
    filter: blur(90px); opacity: 0.55; z-index: 0; pointer-events: none;
    transition: opacity 0.4s ease;
  }
  body.dark::before {
    width: 480px; height: 480px;
    background: radial-gradient(circle, rgba(212,175,55,0.18), transparent 70%);
    top: -140px; right: -120px;
    animation: float1 14s ease-in-out infinite;
  }
  body.dark::after {
    width: 520px; height: 520px;
    background: radial-gradient(circle, rgba(184,148,31,0.14), transparent 70%);
    bottom: -180px; left: -140px;
    animation: float2 16s ease-in-out infinite;
  }
  body.light::before {
    width: 480px; height: 480px;
    background: radial-gradient(circle, #f5d76e, transparent 70%);
    top: -140px; right: -120px;
    opacity: 0.4;
    animation: float1 14s ease-in-out infinite;
  }
  body.light::after {
    width: 520px; height: 520px;
    background: radial-gradient(circle, #d4af37, transparent 70%);
    bottom: -180px; left: -140px;
    opacity: 0.3;
    animation: float2 16s ease-in-out infinite;
  }
  @keyframes float1 {
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(-40px,50px) scale(1.1);}
  }
  @keyframes float2 {
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(50px,-40px) scale(1.15);}
  }
  .bg-blob {
    position: fixed; width: 400px; height: 400px; border-radius: 50%;
    background: radial-gradient(circle, rgba(245,215,110,0.1), transparent 70%);
    filter: blur(100px); opacity: 0.6; top: 40%; left: 45%;
    z-index: 0; pointer-events: none;
    animation: float3 18s ease-in-out infinite;
    transition: opacity 0.4s ease;
  }
  body.light .bg-blob {
    background: radial-gradient(circle, #d4af37, transparent 70%);
    opacity: 0.15;
  }
  @keyframes float3 {
    0%,100%{transform:translate(-50%,-50%) scale(1);}
    50%{transform:translate(-45%,-55%) scale(1.2);}
  }

  .container { max-width: 900px; margin: 0 auto; position: relative; z-index: 1; }

  header { text-align: center; margin-bottom: 22px; padding: 16px; }

  .theme-toggle {
    position: fixed;
    top: 20px; left: 20px;
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1.5px solid var(--glass-border);
    color: var(--gold-light);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    z-index: 100;
    box-shadow: 0 4px 16px var(--shadow), 0 0 15px rgba(212,175,55,0.15);
    padding: 0;
    font-family: inherit;
  }
  body.light .theme-toggle { color: var(--gold); }
  .theme-toggle svg { width: 22px; height: 22px; }
  .theme-toggle:hover {
    transform: scale(1.1) rotate(15deg);
    border-color: var(--gold);
    box-shadow: 0 4px 16px var(--shadow), 0 0 25px rgba(212,175,55,0.4);
  }

  .logo {
    width: 110px; height: 110px;
    object-fit: contain;
    display: block;
    margin: 0 auto 14px;
    border-radius: 50%;
    animation: logoFloat 4.5s ease-in-out infinite;
    padding: 6px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: all 0.3s ease;
  }
  body.dark .logo {
    background: rgba(20,20,20,0.6);
    border: 1.5px solid rgba(212,175,55,0.5);
    filter: drop-shadow(0 8px 24px rgba(212,175,55,0.4))
            drop-shadow(0 3px 10px rgba(0,0,0,0.6));
  }
  body.light .logo {
    background: rgba(255,255,255,0.7);
    border: 1.5px solid rgba(212,175,55,0.35);
    filter: drop-shadow(0 8px 24px rgba(212,175,55,0.5))
            drop-shadow(0 3px 10px rgba(0,0,0,0.3));
  }
  @keyframes logoFloat {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-6px) rotate(-1deg); }
  }

  header h1 {
    font-size: 2.1rem;
    font-weight: 800;
    margin-bottom: 12px;
    line-height: 1.4;
    background: linear-gradient(135deg, var(--text-light) 0%, var(--gold-light) 45%, var(--gold) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.5px;
  }

  .subtitle-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-top: 6px;
  }

  .subtitle-line {
    flex: 1;
    max-width: 60px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(212,175,55,0.6), transparent);
    border-radius: 1px;
  }

  .subtitle-text {
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--text-soft);
    letter-spacing: 0.3px;
    position: relative;
    padding: 0 4px;
    white-space: nowrap;
  }

  .subtitle-text::before,
  .subtitle-text::after {
    content: "◆";
    font-size: 0.5rem;
    color: var(--gold);
    opacity: 0.7;
    vertical-align: middle;
    margin: 0 6px;
    position: relative;
    top: -1px;
  }

  .glass {
    background: var(--glass-bg);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1.5px solid var(--glass-border);
    border-radius: 20px;
    box-shadow:
      0 8px 32px var(--shadow),
      inset 0 1px 0 rgba(212,175,55,0.15),
      0 0 0 1px rgba(212,175,55,0.05),
      0 0 20px rgba(212,175,55,0.08);
    transition: background 0.3s ease, border 0.3s ease, box-shadow 0.3s ease;
  }
  body.light .glass {
    box-shadow:
      0 8px 32px var(--shadow),
      inset 0 1px 0 rgba(255,255,255,0.5),
      0 0 0 1px rgba(212,175,55,0.08);
  }

  .search-box { padding: 22px; margin-bottom: 16px; }
  .search-box label { display: block; margin-bottom: 12px; font-weight: 600; color: var(--text-light); }
  .search-wrapper { position: relative; display: flex; align-items: center; }
  .search-icon {
    position: absolute; right: 18px;
    display: flex; align-items: center; justify-content: center;
    opacity: 0.6; pointer-events: none; z-index: 1;
    color: var(--gold-light);
  }
  body.light .search-icon { color: var(--gold); }
  .search-icon svg { width: 20px; height: 20px; }

  input[type="text"] {
    width: 100%;
    padding: 15px 52px 15px 52px;
    font-size: 1rem;
    font-family: inherit;
    color: var(--text-light);
    background: var(--input-bg);
    border: 1.5px solid var(--input-border);
    border-radius: 14px;
    transition: all 0.25s ease;
  }
  input[type="text"]::placeholder { color: var(--text-dim); }
  input[type="text"]:focus {
    outline: none;
    background: var(--glass-hover);
    border-color: var(--gold);
    box-shadow: 0 0 0 4px rgba(212,175,55,0.15), 0 0 20px rgba(212,175,55,0.15);
  }

  .clear-btn {
    position: absolute; left: 12px;
    width: 30px; height: 30px;
    border-radius: 50%;
    background: rgba(212,175,55,0.1);
    border: 1px solid rgba(212,175,55,0.3);
    color: var(--gold-light);
    font-size: 0.9rem;
    cursor: pointer;
    display: none;
    align-items: center; justify-content: center;
    transition: all 0.2s ease;
    padding: 0; box-shadow: none; font-family: inherit;
  }
  .clear-btn.visible { display: flex; }
  .clear-btn:hover {
    background: rgba(255, 107, 107, 0.3);
    border-color: rgba(255, 107, 107, 0.5);
    color: #fff;
    transform: scale(1.05);
  }

  .next-class-card { padding: 24px; margin-bottom: 16px; display: none; animation: slideDown 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
  .next-class-card.visible { display: block; }
  @keyframes slideDown {
    from{opacity:0;transform:translateY(-20px);}
    to{opacity:1;transform:translateY(0);}
  }
  .next-class-card.teaching {
    border-color: rgba(52,211,153,0.5);
    box-shadow: 0 8px 32px var(--shadow), inset 0 1px 0 rgba(52,211,153,0.15),
                0 0 40px rgba(52,211,153,0.25);
  }
  .next-class-card.upcoming {
    border-color: rgba(212,175,55,0.5);
    box-shadow: 0 8px 32px var(--shadow), inset 0 1px 0 rgba(212,175,55,0.15),
                0 0 40px rgba(212,175,55,0.25);
  }

  .next-class-header {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 16px; color: var(--text-soft);
    font-size: 0.85rem; font-weight: 600;
  }
  .pulse-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--green);
    animation: pulse 2s infinite;
  }
  .pulse-dot.gold { background: var(--gold); }
  .pulse-dot.gray { background: #94a3b8; }
  @keyframes pulse {
    0%{box-shadow:0 0 0 0 rgba(52,211,153,0.7);}
    70%{box-shadow:0 0 0 12px rgba(52,211,153,0);}
    100%{box-shadow:0 0 0 0 rgba(52,211,153,0);}
  }

  .countdown {
    font-size: 2.4rem; font-weight: 800; line-height: 1.2; margin-bottom: 8px;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(135deg, var(--text-light), var(--gold-light));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .next-class-card.teaching .countdown {
    background: linear-gradient(135deg, var(--text-light), var(--green));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .countdown-sub { font-size: 1rem; color: var(--text-soft); margin-bottom: 16px; }
  .next-class-info {
    display: flex; flex-wrap: wrap; gap: 12px;
    padding-top: 16px; border-top: 1px solid var(--card-border);
  }
  .info-chip {
    display: flex; align-items: center; gap: 6px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    padding: 8px 14px; border-radius: 10px; font-size: 0.85rem;
    color: var(--text-light);
  }
  .info-chip strong { color: var(--gold-light); font-weight: 700; }

  .progress-bar {
    width: 100%; height: 8px;
    background: var(--card-bg);
    border-radius: 10px; overflow: hidden;
    margin: 4px 0 10px;
    border: 1px solid var(--card-border);
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #34d399, #10b981);
    border-radius: 10px;
    transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 0 12px rgba(52,211,153,0.5);
  }
  .progress-labels {
    display: flex; justify-content: space-between;
    font-size: 0.75rem; color: var(--text-soft);
    margin-bottom: 16px;
  }

  .next-class-card.teaching.warning {
    border-color: rgba(251, 191, 36, 0.6);
    animation: warningPulse 2s ease-in-out infinite;
  }
  .next-class-card.teaching.warning .countdown {
    background: linear-gradient(135deg, var(--text-light), #fbbf24);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .next-class-card.teaching.warning .pulse-dot {
    background: #fbbf24;
    animation: pulseWarning 1s infinite;
  }
  .next-class-card.teaching.warning .progress-fill {
    background: linear-gradient(90deg, #fbbf24, #f59e0b);
    box-shadow: 0 0 12px rgba(251,191,36,0.6);
  }
  @keyframes warningPulse {
    0%, 100% { box-shadow: 0 8px 32px var(--shadow), 0 0 40px rgba(251,191,36,0.35); }
    50%      { box-shadow: 0 8px 32px var(--shadow), 0 0 55px rgba(251,191,36,0.6); }
  }
  @keyframes pulseWarning {
    0%   { box-shadow: 0 0 0 0 rgba(251,191,36,0.7); }
    70%  { box-shadow: 0 0 0 12px rgba(251,191,36,0); }
    100% { box-shadow: 0 0 0 0 rgba(251,191,36,0); }
  }

  .result { padding: 26px; min-height: 0; animation: fadeIn 0.35s cubic-bezier(0.4, 0, 0.2, 1); }
  @keyframes fadeIn {
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
  }

  .teacher-header {
    display: flex; align-items: center; gap: 16px;
    padding-bottom: 20px; border-bottom: 1px solid var(--card-border);
    margin-bottom: 22px;
  }
  .avatar {
    width: 58px; height: 58px; border-radius: 50%;
    background: linear-gradient(135deg, rgba(212,175,55,0.9), rgba(245,215,110,0.9));
    border: 1.5px solid rgba(212,175,55,0.6);
    display: flex; align-items: center; justify-content: center;
    color: #1a1a1a; font-weight: 800; font-size: 1.4rem; flex-shrink: 0;
    box-shadow: 0 4px 16px rgba(212,175,55,0.3);
  }
  .teacher-header h2 { font-size: 1.25rem; font-weight: 700; margin-bottom: 5px; color: var(--text-light); }
  .teacher-header small { color: var(--text-soft); font-size: 0.83rem; }

  .selection-header {
    text-align: center;
    padding: 10px 0 24px;
    border-bottom: 1px solid var(--card-border);
    margin-bottom: 22px;
  }
  .selection-icon { font-size: 2.8rem; display: block; margin-bottom: 12px; }
  .selection-header h2 { font-size: 1.15rem; font-weight: 700; margin-bottom: 8px; color: var(--text-light); }
  .selection-header p { color: var(--text-soft); font-size: 0.88rem; }
  .selection-list { display: flex; flex-direction: column; gap: 12px; }
  .selection-card {
    display: flex; align-items: center; gap: 16px;
    padding: 18px 20px;
    background: var(--card-bg);
    border: 1.5px solid var(--card-border);
    border-radius: 16px;
    cursor: pointer; transition: all 0.25s ease;
    position: relative; overflow: hidden;
  }
  .selection-card::before {
    content: ""; position: absolute;
    right: 0; top: 0; bottom: 0; width: 4px;
    background: linear-gradient(180deg, #d4af37, #f5d76e);
    border-radius: 4px; transition: width 0.25s ease;
  }
  .selection-card:hover {
    background: var(--glass-hover);
    border-color: var(--gold);
    transform: translateX(-6px);
    box-shadow: 0 8px 24px rgba(212,175,55,0.25), 0 0 20px rgba(212,175,55,0.15);
  }
  .selection-card:hover::before { width: 6px; }
  .selection-avatar {
    width: 54px; height: 54px; border-radius: 50%;
    background: linear-gradient(135deg, rgba(212,175,55,0.9), rgba(245,215,110,0.9));
    border: 1.5px solid rgba(212,175,55,0.6);
    display: flex; align-items: center; justify-content: center;
    color: #1a1a1a; font-weight: 800; font-size: 1.3rem; flex-shrink: 0;
  }
  .selection-info { flex: 1; }
  .selection-name { font-weight: 700; font-size: 1.05rem; color: var(--text-light); margin-bottom: 6px; }
  .selection-subject { font-size: 0.88rem; color: var(--gold-light); margin-bottom: 4px; font-weight: 600; }
  .selection-count { font-size: 0.78rem; color: var(--text-soft); }
  .selection-arrow { font-size: 1.5rem; color: var(--gold-light); opacity: 0.5; transition: all 0.25s ease; }
  .selection-card:hover .selection-arrow { opacity: 1; transform: translateX(-6px); }

  .class-list { display: flex; flex-direction: column; gap: 10px; }
  .class-item {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px;
    background: var(--card-bg);
    border: 1.5px solid var(--card-border);
    border-radius: 14px; transition: all 0.25s ease;
    position: relative; overflow: hidden;
  }
  .class-item::before {
    content: ""; position: absolute; right: 0; top: 0; bottom: 0;
    width: 4px; background: linear-gradient(180deg, #d4af37, #f5d76e);
    border-radius: 4px;
  }
  .class-item.current {
    background: rgba(52,211,153,0.12);
    border-color: rgba(52,211,153,0.4);
  }
  .class-item.current::before { background: linear-gradient(180deg, #34d399, #10b981); }
  .class-item:hover {
    background: var(--glass-hover);
    transform: translateX(-5px);
    border-color: rgba(212,175,55,0.5);
    box-shadow: 0 4px 16px rgba(212,175,55,0.15);
  }

  .period-badge {
    background: linear-gradient(135deg, rgba(212,175,55,0.95), rgba(245,215,110,0.95));
    color: #1a1a1a; padding: 9px 14px; border-radius: 10px;
    font-weight: 700; font-size: 0.85rem; white-space: nowrap;
    min-width: 80px; text-align: center; flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(212,175,55,0.3);
  }
  .class-item.current .period-badge {
    background: linear-gradient(135deg, #34d399, #10b981); color: #042f2e;
  }

  .class-info { flex: 1; }
  .class-info .name { font-weight: 600; margin-bottom: 5px; font-size: 0.95rem; color: var(--text-light); }
  .class-info .details { color: var(--text-soft); font-size: 0.8rem; }

  .class-number {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    color: var(--text-light);
    padding: 10px 14px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 0.88rem;
    white-space: nowrap;
    flex-shrink: 0;
    transition: all 0.25s ease;
  }
  .class-item.current .class-number {
    background: rgba(52,211,153,0.25);
    border-color: rgba(52,211,153,0.5);
    color: #6ee7b7;
  }
  .class-item:hover .class-number {
    background: rgba(212,175,55,0.2);
    border-color: var(--gold);
    color: var(--gold-light);
  }

  .today-section { margin-bottom: 8px; }
  .today-header {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px;
    background: linear-gradient(135deg, rgba(212,175,55,0.18), rgba(245,215,110,0.08));
    border: 1px solid rgba(212,175,55,0.4);
    border-radius: 12px; margin-bottom: 14px;
  }
  .today-icon { font-size: 1.3rem; }
  .today-title { flex: 1; font-weight: 700; color: var(--gold-light); font-size: 1rem; }
  .today-count {
    background: rgba(212,175,55,0.3); color: var(--text-light);
    padding: 4px 12px; border-radius: 20px;
    font-size: 0.78rem; font-weight: 700;
    border: 1px solid rgba(212,175,55,0.5);
  }
  body.dark .today-count { color: var(--gold-light); }

  .class-item.past { opacity: 0.55; }
  .class-item.past::before { background: linear-gradient(180deg, #64748b, #94a3b8); }
  .class-item.past .period-badge {
    background: linear-gradient(135deg, #475569, #64748b);
    color: #cbd5e1;
  }
  .class-item.past .class-number {
    background: rgba(148,163,184,0.15);
    border-color: rgba(148,163,184,0.3);
    color: #94a3b8;
  }

/* ==========================================================
   تفکیک دبیران هم‌نام
   ========================================================== */
var HOMONYM_MAP = {
  "کریمی|زبان": "علی کریمی",
  "کریمی|انگلیسی": "علی کریمی",
  "کریمی|شیمی": "علیرضا کریمی",
  "کریمی|آزمایشگاه": "علیرضا کریمی"
};

/* ==========================================================
   نرمال‌سازی متن
   ========================================================== */
function normalize(str){
  if(!str) return "";
  return String(str)
    .replace(/[\u064B-\u0652\u0670\u0640]/g, "")
    .replace(/ي/g, "ی").replace(/ى/g, "ی")
    .replace(/ك/g, "ک")
    .replace(/ة/g, "ه")
    .replace(/[أإآ]/g, "ا")
    .replace(/ؤ/g, "و")
    .replace(/\s+/g, " ")
    .trim()
    .toLowerCase();
}

/* ==========================================================
   استخراج دبیران از یک متن درس
   پشتیبانی از:
   - "درس - استاد X"
   - "درس - استاد X / درس - استاد Y"
   - "درس - استاد X و درس - استاد Y"
   ========================================================== */
function extractTeachers(lessonText){
  var result = [];
  if(!lessonText || !lessonText.trim()) return result;

  /* جدا کردن با / و " و " */
  var parts = lessonText.split(/\s*\/\s*|\s+و\s+/);

  parts.forEach(function(part){
    part = part.trim();
    if(!part) return;

    /* جدا کردن درس و دبیر */
    var m = part.split(" - ");
    if(m.length < 2) return;
    var subj = m[0].trim();
    var tr = m[1].replace("استاد ", "").trim();
    if(!tr || tr.indexOf("معاون") === 0) return;
    result.push({ subject: subj, teacher: tr });
  });

  return result;
}

/* ==========================================================
   ساخت دیتابیس
   ========================================================== */
function buildDB(){
  var db = {};
  rawData.forEach(function(item){
    var cn = item[0], sch = item[1];
    sch.forEach(function(dr){
      var day = dr[0], lessons = dr[1];
      lessons.forEach(function(lt, idx){
        if(!lt || !lt.trim() || lt === "زنگ آزمون" || lt === "مهارت") return;

        var entries = extractTeachers(lt);
        entries.forEach(function(e){
          var key = e.teacher + "|" + e.subject;
          var displayName = HOMONYM_MAP[key] || e.teacher;

          if(!db[displayName]) db[displayName] = { name: displayName, classes: [], subjects: {}, classNames: {} };
          var p = idx + 1;
          db[displayName].classes.push({
            className: cn, day: day, period: p,
            subject: e.subject,
            start: PERIODS[p].start, end: PERIODS[p].end
          });
          db[displayName].subjects[e.subject] = true;
          db[displayName].classNames[cn] = true;
        });
      });
    });
  });
  return db;
}

var teacherDB = buildDB();
var teacherNames = Object.keys(teacherDB).sort();

var searchIndex = [];
Object.keys(teacherDB).forEach(function(name){
  var counts = {};
  teacherDB[name].classes.forEach(function(c){
    counts[c.subject] = (counts[c.subject] || 0) + 1;
  });
  var topSubject = "", topCount = 0;
  Object.keys(counts).forEach(function(s){
    if(counts[s] > topCount){ topCount = counts[s]; topSubject = s; }
  });
  teacherDB[name].mainSubject = topSubject;

  var searchText = [
    name, topSubject,
    Object.keys(teacherDB[name].subjects).join(" "),
    Object.keys(teacherDB[name].classNames).join(" ")
  ].join(" ");

  searchIndex.push({
    name: name,
    normalized: normalize(searchText),
    normalizedName: normalize(name),
    mainSubject: topSubject
  });
});

   ========================================================== */
function toFa(n){
  var d = ["۰","۱","۲","۳","۴","۵","۶","۷","۸","۹"];
  return String(n).replace(/\d/g, function(x){ return d[x]; });
}
function esc(s){
  var d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}
function t2m(s){
  var p = s.split(":");
  return parseInt(p[0]) * 60 + parseInt(p[1]);
}
function highlight(text, query){
  if(!query || !text) return esc(text);
  var normalizedText = normalize(text);
  var normalizedQuery = normalize(query);
  var idx = normalizedText.indexOf(normalizedQuery);
  if(idx === -1) return esc(text);
  var before = text.substring(0, idx);
  var middle = text.substring(idx, idx + query.length);
  var after = text.substring(idx + query.length);
  return esc(before) + '<mark class="highlight">' + esc(middle) + '</mark>' + esc(after);
}

var STORAGE = { theme: "bagheri_theme" };

function loadTheme(){
  try {
    var saved = localStorage.getItem(STORAGE.theme);
    if(saved === "dark" || saved === "light"){
      return saved;
    }
  } catch(e) {}

  if(window.matchMedia){
    if(window.matchMedia("(prefers-color-scheme: dark)").matches){
      return "dark";
    }
    if(window.matchMedia("(prefers-color-scheme: light)").matches){
      return "light";
    }
  }

  return "dark";
}
function saveTheme(t){
  try { localStorage.setItem(STORAGE.theme, t); } catch(e){}
}
function applyTheme(t){
  document.body.className = t;
  var icon = document.getElementById("themeIcon");
  if(!icon) return;
  if(t === "dark"){
    icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
  } else {
    icon.innerHTML = '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>';
  }
}
function toggleTheme(){
  var cur = document.body.classList.contains("dark") ? "dark" : "light";
  var next = cur === "dark" ? "light" : "dark";
  saveTheme(next);
  applyTheme(next);
  showToast(next === "dark" ? "🌙 حالت تاریک" : "☀️ حالت روشن");
}

   ========================================================== */
var currentTeacher = null;
var timer = null;

function doSearch(){
  var input = document.getElementById("si");
  var q = input.value.trim();
  var res = document.getElementById("res");
  var ncc = document.getElementById("ncc");
  var clearBtn = document.getElementById("clearBtn");

  if(q.length > 0){
    clearBtn.classList.add("visible");
  } else {
    clearBtn.classList.remove("visible");
  }

  if(timer){ clearInterval(timer); timer = null; }

  if(!q){
    res.style.display = "none";
    res.innerHTML = "";
    ncc.classList.remove("visible");
    currentTeacher = null;
    return;
  }

  res.style.display = "block";

  var normalizedQuery = normalize(q);
  var matches = [];
  searchIndex.forEach(function(item){
    if(item.normalized.indexOf(normalizedQuery) > -1){
      matches.push(item.name);
    }
  });

  if(matches.length === 0){
    var similar = findSimilar(normalizedQuery);
    var html = '<div class="error-state"><span class="icon">❌</span><p>دبیری با نام «' + esc(q) + '» پیدا نشد</p>';
    if(similar.length > 0){
      html += '<p style="margin-top: 14px; font-size: 0.85rem">شاید منظورتان این‌ها بود:</p>';
      html += '<div class="suggestions">';
      similar.forEach(function(n){
        html += '<div class="suggestion-chip" onclick="quickSearch(\'' + n.replace(/'/g, "\\'") + '\')">' + esc(n) + '</div>';
      });
      html += '</div>';
    }
    html += '</div>';
    res.innerHTML = html;
    ncc.classList.remove("visible");
    currentTeacher = null;
    return;
  }

  if(matches.length === 1){
    currentTeacher = matches[0];
    res.innerHTML = renderTeacher(teacherDB[matches[0]], true, q);
    ncc.classList.add("visible");
    updateNCC();
    timer = setInterval(updateNCC, 1000);
    return;
  }

  currentTeacher = null;
  ncc.classList.remove("visible");

  var selectionHtml = '<div class="selection-header">' +
    '<span class="selection-icon">👥</span>' +
    '<h2>چند دبیر با این نام پیدا شد</h2>' +
    '<p>لطفاً دبیر مورد نظر خود را انتخاب کنید</p>' +
    '</div>' +
    '<div class="selection-list">';

  matches.forEach(function(name){
    var t = teacherDB[name];
    var initial = name.charAt(0);
    selectionHtml += '<div class="selection-card" onclick="selectTeacher(\'' + name.replace(/'/g, "\\'") + '\')">' +
      '<div class="selection-avatar">' + initial + '</div>' +
      '<div class="selection-info">' +
        '<div class="selection-name">استاد ' + highlight(name, q) + '</div>' +
        '<div class="selection-subject">📚 ' + esc(t.mainSubject) + '</div>' +
        '<div class="selection-count">' + toFa(t.classes.length) + ' کلاس در هفته</div>' +
      '</div>' +
      '<div class="selection-arrow">←</div>' +
    '</div>';
  });

  selectionHtml += '</div>';
  res.innerHTML = selectionHtml;
}

function findSimilar(normalizedQuery){
  if(normalizedQuery.length < 2) return [];
  var prefix = normalizedQuery.substring(0, 2);
  var results = [];
  searchIndex.forEach(function(item){
    if(item.normalizedName.indexOf(prefix) > -1 && results.length < 4){
      results.push(item.name);
    }
  });
  return results;
}

function quickSearch(name){
  document.getElementById("si").value = name;
  doSearch();
}

function clearSearch(){
  document.getElementById("si").value = "";
  document.getElementById("si").focus();
  doSearch();
}

function selectTeacher(name){
  var res = document.getElementById("res");
  var ncc = document.getElementById("ncc");
  var q = document.getElementById("si").value.trim();

  currentTeacher = name;
  res.style.display = "block";
  res.innerHTML = renderTeacher(teacherDB[name], true, q);
  ncc.classList.add("visible");
  updateNCC();
  if(timer) clearInterval(timer);
  timer = setInterval(updateNCC, 1000);

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ==========================================================
   رندر کارت دبیر
   ========================================================== */
function renderTeacher(t, active, query){
  var sorted = t.classes.slice().sort(function(a, b){
    var dd = dayOrder.indexOf(a.day) - dayOrder.indexOf(b.day);
    if(dd !== 0) return dd;
    return a.period - b.period;
  });

  var now = new Date();
  var cDay = now.getDay();
  var cMin = now.getHours() * 60 + now.getMinutes();

  var todayClasses = [];
  var otherClasses = [];
  sorted.forEach(function(c){
    if(dayMap[c.day] === cDay){
      todayClasses.push(c);
    } else {
      otherClasses.push(c);
    }
  });

  var persianTodayName = "";
  Object.keys(dayMap).forEach(function(k){
    if(dayMap[k] === cDay) persianTodayName = k;
  });

  var initial = t.name.charAt(0);

  var html = '<div class="teacher-header">';
  html += '<div class="avatar">' + initial + '</div>';
  html += '<div>';
  html += '<h2>' + (query ? highlight(t.name, query) : esc(t.name)) + '</h2>';
  html += '<small>📚 ' + esc(t.mainSubject) + ' | مجموع ' + toFa(t.classes.length) + ' کلاس در هفته</small>';
  html += '</div>';
  html += '</div>';

  if(todayClasses.length > 0){
    html += '<div class="today-section">';
    html += '<div class="today-header">';
    html += '<span class="today-icon">📅</span>';
    html += '<span class="today-title">کلاس‌های امروز (' + esc(persianTodayName) + ')</span>';
    html += '<span class="today-count">' + toFa(todayClasses.length) + ' کلاس</span>';
    html += '</div>';
    html += '<div class="class-list">';

    todayClasses.forEach(function(c){
      var isCur = active && cMin >= t2m(c.start) && cMin < t2m(c.end);
      var isPast = cMin >= t2m(c.end);
      var itemClass = 'class-item' + (isCur ? ' current' : '') + (isPast ? ' past' : '');

      html += '<div class="' + itemClass + '">';
      html += '<div class="period-badge">زنگ ' + toFa(c.period) + '</div>';
      html += '<div class="class-info">';
      html += '<div class="name">' + (query ? highlight(c.subject, query) : esc(c.subject)) +
              (isCur ? ' <span style="color:#6ee7b7">● در حال تدریس</span>' : '') +
              (isPast ? ' <span style="color:#94a3b8">✓ گذشت</span>' : '') + '</div>';
      html += '<div class="details">🕐 ' + esc(c.start) + ' تا ' + esc(c.end) + '</div>';
      html += '</div>';
      html += '<div class="class-number">🏫 ' + esc(c.className) + '</div>';
      html += '</div>';
    });

    html += '</div></div>';
  } else {
    html += '<div class="no-class-today">';
    html += '<span class="no-class-icon">🎉</span>';
    html += '<div class="no-class-text">امروز (' + esc(persianTodayName) + ') کلاسی نداری</div>';
    html += '<div class="no-class-sub">روز استراحتت مبارک!</div>';
    html += '</div>';
  }

  if(otherClasses.length > 0){
    html += '<div class="week-divider">';
    html += '<span class="divider-line"></span>';
    html += '<span class="divider-text">📋 بقیه هفته</span>';
    html += '<span class="divider-line"></span>';
    html += '</div>';

    var grouped = {};
    otherClasses.forEach(function(c){
      if(!grouped[c.day]) grouped[c.day] = [];
      grouped[c.day].push(c);
    });

    html += '<div class="class-list">';

    Object.keys(grouped).sort(function(a, b){
      return dayOrder.indexOf(a) - dayOrder.indexOf(b);
    }).forEach(function(day){
      html += '<div class="day-group-title">' + esc(day) + '</div>';
      grouped[day].forEach(function(c){
        html += '<div class="class-item">';
        html += '<div class="period-badge">زنگ ' + toFa(c.period) + '</div>';
        html += '<div class="class-info">';
        html += '<div class="name">' + (query ? highlight(c.subject, query) : esc(c.subject)) + '</div>';
        html += '<div class="details">🕐 ' + esc(c.start) + ' تا ' + esc(c.end) + '</div>';
        html += '</div>';
        html += '<div class="class-number">🏫 ' + esc(c.className) + '</div>';
        html += '</div>';
      });
    });

    html += '</div>';
  }

  if(active){
    html += '<div class="teacher-actions">';
    html += '<button class="action-btn" onclick="shareLink()">🔗 کپی لینک</button>';
    html += '<button class="action-btn" onclick="showQR()">📱 QR Code</button>';
    html += '</div>';
  }

  return html;
}

/* ==========================================================
   کلاس فعلی و بعدی دبیر
   ========================================================== */
function findCurNext(t, now){
  var cDay = now.getDay(), cMin = now.getHours() * 60 + now.getMinutes();
  var cur = null;
  for(var i = 0; i < t.classes.length; i++){
    var c = t.classes[i];
    if(dayMap[c.day] === cDay && cMin >= t2m(c.start) && cMin < t2m(c.end)){
      cur = c;
      break;
    }
  }
  var next = null, minDiff = Infinity;
  for(var j = 0; j < t.classes.length; j++){
    var c2 = t.classes[j];
    var cd = dayMap[c2.day];
    var cs = t2m(c2.start);
    var dd = (cd - cDay + 7) % 7;
    var dm = dd * 24 * 60 + (cs - cMin);
    if(dd === 0 && cs <= cMin) dm += 7 * 24 * 60;
    if(dm > 0 && dm < minDiff){ minDiff = dm; next = c2; }
  }
  return { cur: cur, next: next };
}

function updateNCC(){
  if(!currentTeacher) return;
  var card = document.getElementById("ncc");
  var t = teacherDB[currentTeacher];
  var now = new Date();
  var fn = findCurNext(t, now);

  if(fn.cur){
    var cMin = now.getHours() * 60 + now.getMinutes();
    var cSec = now.getSeconds();
    var endMin = t2m(fn.cur.end);
    var startMin = t2m(fn.cur.start);

    var remainMin = endMin - cMin - 1;
    var remainSec = 60 - cSec;
    if(remainSec === 60){ remainSec = 0; remainMin++; }

    var passedMin = cMin - startMin;
    var hh = Math.floor(remainMin / 60);
    var mm = remainMin % 60;

    var timeText;
    if(hh > 0){
      timeText = toFa(hh) + ' ساعت و ' + toFa(mm) + ' دقیقه';
    } else if(mm > 0){
      timeText = toFa(mm) + ' دقیقه و ' + toFa(remainSec) + ' ثانیه';
    } else {
      timeText = toFa(remainSec) + ' ثانیه';
    }

    var totalMin = endMin - startMin;
    var progress = Math.min(100, Math.max(0, (passedMin / totalMin) * 100));

    var almostDone = remainMin < 5 && hh === 0;
    var cardClass = almostDone ? 'teaching warning' : 'teaching';

    card.className = "next-class-card glass visible " + cardClass;
    card.innerHTML =
      '<div class="next-class-header">' +
        '<span class="pulse-dot"></span>' +
        (almostDone ? 'کلاس شما تقریباً تمام شده ⏰' : 'در حال تدریس 🟢') +
      '</div>' +
      '<div class="countdown">' + timeText + '</div>' +
      '<div class="countdown-sub">' +
        (almostDone ? 'زودتر آماده پایان کلاس باش' : 'تا پایان این کلاس') +
      '</div>' +
      '<div class="progress-bar">' +
        '<div class="progress-fill" style="width:' + progress + '%"></div>' +
      '</div>' +
      '<div class="progress-labels">' +
        '<span>شروع: ' + esc(fn.cur.start) + '</span>' +
        '<span>' + toFa(Math.round(progress)) + '٪ گذشت</span>' +
        '<span>پایان: ' + esc(fn.cur.end) + '</span>' +
      '</div>' +
      '<div class="next-class-info">' +
        '<div class="info-chip">📚 <strong>' + esc(fn.cur.subject) + '</strong></div>' +
        '<div class="info-chip">🏫 ' + esc(fn.cur.className) + '</div>' +
        '<div class="info-chip">🕐 ' + esc(fn.cur.start) + ' تا ' + esc(fn.cur.end) + '</div>' +
        '<div class="info-chip">🔔 زنگ ' + toFa(fn.cur.period) + '</div>' +
      '</div>';
    return;
  }

  if(fn.next){
    var cDay = now.getDay(), cMin = now.getHours() * 60 + now.getMinutes(), cSec = now.getSeconds();
    var nd = dayMap[fn.next.day];
    var ns = t2m(fn.next.start);
    var dd = (nd - cDay + 7) % 7;
    var tm = dd * 24 * 60 + (ns - cMin);
    if(dd === 0 && ns <= cMin) tm += 7 * 24 * 60;

    var THREE_HOURS = 3 * 60;

    if(tm <= THREE_HOURS){
      var d = Math.floor(tm / (24 * 60));
      var h = Math.floor((tm % (24 * 60)) / 60);
      var m = tm % 60;
      var s = 60 - cSec;
      if(s === 60) s = 0;
      var txt = "";
      if(d > 0) txt = toFa(d) + " روز و " + toFa(h) + " ساعت";
      else if(h > 0) txt = toFa(h) + " ساعت و " + toFa(m) + " دقیقه";
      else if(m > 0) txt = toFa(m) + " دقیقه و " + toFa(s) + " ثانیه";
      else txt = toFa(s) + " ثانیه";

      var close = tm <= 10;
      card.className = "next-class-card glass visible " + (close ? "upcoming" : "");
      card.innerHTML = '<div class="next-class-header"><span class="pulse-dot ' + (close ? "gold" : "gray") + '"></span>' +
        (close ? "کلاس بعدی نزدیک است ⏰" : "کلاس بعدی شما") + '</div>' +
        '<div class="countdown">' + txt + '</div>' +
        '<div class="countdown-sub">تا شروع کلاس بعدی</div>' +
        '<div class="next-class-info"><div class="info-chip">📚 <strong>' + esc(fn.next.subject) + '</strong></div>' +
        '<div class="info-chip">🏫 ' + esc(fn.next.className) + '</div>' +
        '<div class="info-chip">📅 ' + esc(fn.next.day) + '</div>' +
        '<div class="info-chip">🕐 ' + esc(fn.next.start) + ' تا ' + esc(fn.next.end) + '</div>' +
        '<div class="info-chip">🔔 زنگ ' + toFa(fn.next.period) + '</div></div>';
      return;
    }

    var dayText;
    if(dd === 0){ dayText = "امروز"; }
    else if(dd === 1){ dayText = "فردا"; }
    else { dayText = fn.next.day; }

    card.className = "next-class-card glass visible";
    card.innerHTML = '<div class="next-class-header"><span class="pulse-dot gray"></span>کلاس بعدی شما</div>' +
      '<div class="countdown" style="font-size:1.9rem">' + esc(dayText) + ' کلاس داری 📅</div>' +
      '<div class="countdown-sub">ساعت ' + esc(fn.next.start) + ' - ' + esc(fn.next.day) + '</div>' +
      '<div class="next-class-info"><div class="info-chip">📚 <strong>' + esc(fn.next.subject) + '</strong></div>' +
      '<div class="info-chip">🏫 ' + esc(fn.next.className) + '</div>' +
      '<div class="info-chip">🕐 ' + esc(fn.next.start) + ' تا ' + esc(fn.next.end) + '</div>' +
      '<div class="info-chip">🔔 زنگ ' + toFa(fn.next.period) + '</div></div>';
    return;
  }

  card.className = "next-class-card glass visible";
  card.innerHTML = '<div class="next-class-header"><span class="pulse-dot gray"></span>کلاس بعدی</div>' +
    '<div class="countdown">کلاسی یافت نشد</div>';
}

/* ==========================================================
   اشتراک‌گذاری
   ========================================================== */
function buildTeacherURL(name){
  var base = window.location.origin + window.location.pathname;
  return base + "?teacher=" + encodeURIComponent(name);
}

function shareLink(){
  if(!currentTeacher) return;
  var url = buildTeacherURL(currentTeacher);

  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(url).then(function(){
      showToast("✅ لینک کپی شد!");
    }).catch(function(){
      fallbackCopy(url);
    });
  } else {
    fallbackCopy(url);
  }
}

function fallbackCopy(text){
  var ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand("copy");
    showToast("✅ لینک کپی شد!");
  } catch(e) {
    showToast("❌ کپی نشد، دستی کپی کنید", true);
    prompt("لینک دبیر:", text);
  }
  document.body.removeChild(ta);
}

/* ==========================================================
   QR
   ========================================================== */
var qrInstance = null;

function showQR(){
  if(!currentTeacher) return;

  var modal = document.getElementById("qrModal");
  var box = document.getElementById("qrBox");
  var nameEl = document.getElementById("qrTeacherName");

  box.innerHTML = "";
  nameEl.textContent = "استاد " + currentTeacher;

  var url = buildTeacherURL(currentTeacher);

  try {
    qrInstance = new QRCode(box, {
      text: url,
      width: 220, height: 220,
      colorDark: "#0a0a0a",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H    });
    modal.classList.add("visible");
  } catch(e) {
    showToast("❌ خطا در ساخت QR", true);
    console.error(e);
  }
}

function closeQR(event){
  if(event && event.target && event.target.id !== "qrModal") return;
  document.getElementById("qrModal").classList.remove("visible");
}

function downloadQR(){
  var box = document.getElementById("qrBox");
  var canvas = box.querySelector("canvas");
  var img = box.querySelector("img");

  var dataURL = null;
  if(canvas){
    dataURL = canvas.toDataURL("image/png");
  } else if(img && img.src){
    dataURL = img.src;
  }

  if(!dataURL){
    showToast("❌ تصویری برای دانلود نیست", true);
    return;
  }

  var link = document.createElement("a");
  link.download = "QR-" + currentTeacher + ".png";
  link.href = dataURL;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);

  showToast("✅ تصویر دانلود شد!");
}

/* ==========================================================
   توست
   ========================================================== */
var toastTimer = null;
function showToast(msg, isError){
  var toast = document.getElementById("toast");
  if(!toast) return;

  toast.textContent = msg;
  toast.className = "toast visible" + (isError ? " error" : "");

  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){
    toast.className = "toast";
  }, 2500);
}

/* ==========================================================
   پارامتر URL
   ========================================================== */
function checkURLParam(){
  var params = new URLSearchParams(window.location.search);
  var teacher = params.get("teacher");

  if(teacher){
    var decoded = decodeURIComponent(teacher);
    document.getElementById("si").value = decoded;
    doSearch();
  }
}

/* ==========================================================
   رویدادها
   ========================================================== */
var liveSearchTimer = null;
document.getElementById("si").addEventListener("input", function(){
  if(liveSearchTimer) clearTimeout(liveSearchTimer);
  liveSearchTimer = setTimeout(doSearch, 120);
});

document.getElementById("si").addEventListener("keypress", function(e){
  if(e.key === "Enter"){
    if(liveSearchTimer) clearTimeout(liveSearchTimer);
    doSearch();
  }
});

document.addEventListener("keydown", function(e){
  if(e.key === "Escape"){
    document.getElementById("qrModal").classList.remove("visible");
  }
  if((e.ctrlKey && e.key === "k") || (e.key === "/" && document.activeElement !== document.getElementById("si"))){
    e.preventDefault();
    document.getElementById("si").focus();
    document.getElementById("si").select();
  }
});

if(window.matchMedia){
  var darkMedia = window.matchMedia("(prefers-color-scheme: dark)");
  var lightMedia = window.matchMedia("(prefers-color-scheme: light)");

  var handleSystemThemeChange = function(){
    try {
      var saved = localStorage.getItem(STORAGE.theme);
      if(saved === "dark" || saved === "light") return;
    } catch(e) {}

    var newTheme = darkMedia.matches ? "dark" : (lightMedia.matches ? "light" : "dark");
    applyTheme(newTheme);
  };

  if(darkMedia.addEventListener){
    darkMedia.addEventListener("change", handleSystemThemeChange);
    lightMedia.addEventListener("change", handleSystemThemeChange);
  } else if(darkMedia.addListener){
    darkMedia.addListener(handleSystemThemeChange);
    lightMedia.addListener(handleSystemThemeChange);
  }
}

applyTheme(loadTheme());
checkURLParam();
startQuoteRotation();

if(window.innerWidth > 600){
  setTimeout(function(){
    document.getElementById("si").focus();
  }, 300);
}
</script>
